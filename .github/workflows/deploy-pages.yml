name: Deploy verified static Formula Bloom site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: formula-bloom-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public static repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble only public static assets and validate catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/_site/' ./ _site/
          test -f _site/index.html
          test -f _site/.nojekyll
          test -f _site/sw.js
          test -f _site/registered-products.js
          test ! -e _site/.github
          test ! -e _site/.git
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const archivedPublicLinks=fs.readFileSync('_site/resources.html','utf8');
          const catalog=JSON.parse(fs.readFileSync('_site/brand-product-registration.json','utf8'));
          const archived=JSON.parse(fs.readFileSync('_site/formula-records.json','utf8'));
          const coverage169=JSON.parse(fs.readFileSync('_site/full-formula-readiness-rc169.json','utf8'));
          const new169=JSON.parse(fs.readFileSync('_site/formula-records-rc169.json','utf8'));
          const expectedTotalArchive=coverage169.archivedAll;
          const unverifiedCurrently=2163-expectedTotalArchive;
          const previouslyUnknownNowConfirmed=expectedTotalArchive-409;
          if(coverage169.release!=='1.0.0-rc.169'||coverage169.priorReady!==468||
             coverage169.readyProducts!==468+new169.records.length||
             coverage169.excludedPriorArchive!==7||
             coverage169.activeProducts!==2020||
             coverage169.remainingToGoal!==Math.max(0,600-coverage169.readyProducts)||
             coverage169.exactMakerJanPages!==new169.records.length||
             new169.records.length<1||
             !archivedPublicLinks.includes('full-formula-readiness-rc169.html')||
             fs.existsSync('_site/data/rc169-resumable-japanese-maker-formulas-checkpoint-20261104.json')||
             fs.existsSync('_site/data/rc169-exact-japan-kao-full-formulas-20261104.json'))
             throw Error('rc169 original source-backed additions, readiness goals or private boundary invalid');
          const added169Ids=new Set(new169.records.map(r=>r.productId));
          if(added169Ids.size!==new169.records.length||
             new169.records.some(r=>!r.productId||!r.sku||!r.sourceUrl.endsWith(r.sku+'/')||
               !/^49\d{11}$/.test(r.sku)||r.ingredientCount!==r.ingredients.split('、').length||
               r.ingredientCount<12||r.formulaUpdatedAt!==null||
               r.sourceReview?.actualPhysicalLabelChecked!==false||
               r.sourceReview?.medicalClassificationCheckedViaOfficialMeta!==true||
               r.sourceReview?.officialMetaExplicitQuasiDrug!==false||
               r.sourceReview?.manufacturerPageExactlyMatchesJan!==true||
               r.sourceReview?.productNameMatched!==true||
               r.sourceReview?.fullIngredientsChecked!==true||
               r.sourceReview?.rightsStatus!=='republication-permission-not-verified')||
             !fs.readFileSync('_site/app.js','utf8').includes('/formula-records-rc169.json')||
             !fs.readFileSync('_site/static-api.js','utf8').includes('/formula-records-rc169.json'))
             throw Error('rc169 exact JAN and original manufacturer Japanese ingredient proof failed');
          const correctedQuasi=archived.records.filter(r=>r.sourceReview?.previouslyMisclassifiedAsCosmetic===true);
          if(correctedQuasi.length!==4||correctedQuasi.some(r=>r.kind!=='quasi'||
              !r.sourceReview?.activeOtherSeparatedFromExplicitManufacturerStarFootnote||
              !r.activeIngredients||!r.otherIngredients||r.ingredientCount!==
                 r.activeIngredients.split('、').length+r.otherIngredients.split('、').length))
             throw Error('rc169 original manufacturer quasi-drug correction missing or malformed');
          console.log('Verified rc169 checked '+new169.records.length+' additional individual Japanese maker formula records');
          // rc170: genuine Japanese maker ingredient-name references are NOT full formulas.
          const partial170=JSON.parse(fs.readFileSync('_site/partial-ingredient-evidence-rc170.json','utf8'));
          const reference170=JSON.parse(fs.readFileSync('_site/partial-reference-progress-rc170.json','utf8'));
          const archivedProductIdSet=new Set(archived.records.map(r=>r.productId));
          const partial170Ids=new Set(partial170.records.map(r=>r.productId));
          const rawNameCount=partial170.records.reduce((sum,r)=>sum+r.sourceOriginalJapaneseNames.length,0);
          if(partial170.records.length!==19||partial170.productCount!==19||partial170Ids.size!==19||
             rawNameCount!==196||partial170.originalJapaneseNameAssociations!==196||
             partial170.records.some(r=>archivedProductIdSet.has(r.productId)||
               !['cosmetic','quasi'].includes(r.kind)||r.coverage!=='partial-only'||
               r.order!=='not-confirmed'||r.labelCompared!==false||
               r.currentFormulaCompared!==false||r.notFullFormulaArchive!==true||
               r.sourceOriginalNamesNotTranslated!==true||
               r.sourceOriginalNamesArePartial!==true||
               r.ingredientCount!==r.ingredients.length||
               r.ingredientCount!==r.sourceOriginalJapaneseNames.length||
               !/^https:\/\/(?:maison\.kose\.co\.jp|www\.attenir\.co\.jp|www\.hikarimirai\.jp)\//.test(r.sourceUrl.replace('attenir','attenir')))||
             partial170.records.filter(r=>r.kind==='quasi').length!==2||
             partial170.records.filter(r=>r.kind==='quasi').some(r=>
               r.sourceActiveIngredientNames?.length!==2||r.sourceOtherIngredientNames?.length!==10)||
             reference170.release!=='1.0.0-rc.170'||
             reference170.fullJapaneseFormulaProducts!==600||
             reference170.partialOnlyAfter!==1107||reference170.withoutIngredientNamesAfter!==313||
             reference170.newJapaneseIngredientReferenceProducts!==19||
             reference170.heldForUncertainIdentityOrSource!==8||
             !fs.readFileSync('_site/app.js','utf8').includes('/partial-ingredient-evidence-rc170.json')||
             !archivedPublicLinks.includes('partial-reference-progress-rc170.html')||
             fs.existsSync('_site/data/rc170-source-specific-partial-ingredient-checkpoint-20261104.json'))
            throw Error('rc170 Japanese maker partial ingredient references or full/partial split failed');
          console.log('Verified rc170: 19 source-backed partial reference products; 600 full formulas unchanged');
          // rc171 remains partial-only: literal Japanese source names, quasi-drugs grouped by maker.
          const partial171=JSON.parse(fs.readFileSync('_site/partial-ingredient-evidence-rc171.json','utf8'));
          const reference171=JSON.parse(fs.readFileSync('_site/partial-reference-progress-rc171.json','utf8'));
          const partial171Ids=new Set(partial171.records.map(r=>r.productId));
          const maker171Hosts=new Set(['www.daiichisankyo-hc.co.jp','maison.kose.co.jp','www.cledepeau-beaute.com']);
          if(partial171.records.length!==13||partial171.productCount!==13||partial171Ids.size!==13||
             partial171.originalJapaneseNameAssociations!==134||
             partial171.records.reduce((sum,r)=>sum+r.ingredientCount,0)!==134||
             partial171.records.some(r=>archivedProductIdSet.has(r.productId)||partial170Ids.has(r.productId)||
               !maker171Hosts.has(new URL(r.sourceUrl).hostname)||
               r.sourceType!=='japanese-manufacturer-website'||r.sourceMarket!=='japan-official'||
               r.coverage!=='partial-only'||r.order!=='not-confirmed'||r.labelCompared!==false||
               r.currentFormulaCompared!==false||r.notFullFormulaArchive!==true||
               r.sourceOriginalNamesNotTranslated!==true||r.sourceOriginalNamesArePartial!==true||
               r.ingredientCount!==r.ingredients.length||r.ingredientCount!==r.sourceOriginalJapaneseNames.length||
               r.ingredientCount<3||!['quasi','cosmetic'].includes(r.kind)||
               !/^[a-f0-9]{64}$/.test(r.sourceEvidenceSha256)||!/^[a-f0-9]{64}$/.test(r.sourceSectionSha256))||
             partial171.records.filter(r=>r.kind==='quasi').length!==11||
             partial171.records.filter(r=>r.kind==='cosmetic').length!==2||
             partial171.records.filter(r=>r.kind==='quasi').some(r=>
               r.sourceActiveIngredientNames?.length!==(r.brand==='ミノン'?2:1)||
               r.sourceOtherIngredientNames?.length!==10)||
             reference171.release!=='1.0.0-rc.171'||
             reference171.fullJapaneseFormulaProducts!==600||
             reference171.partialOnlyBefore!==1107||reference171.partialOnlyAfter!==1120||
             reference171.withoutIngredientNamesBefore!==313||reference171.withoutIngredientNamesAfter!==300||
             reference171.newOriginalManufacturerNameAssociations!==134||
             reference171.newJapaneseIngredientReferenceProducts!==13||
             reference171.heldForUncertainIdentityOrSource!==3||
             !fs.readFileSync('_site/app.js','utf8').includes('/partial-ingredient-evidence-rc171.json')||
             !fs.readFileSync('_site/static-api.js','utf8').includes('/partial-ingredient-evidence-rc171.json')||
             !archivedPublicLinks.includes('partial-reference-progress-rc171.html')||
             !fs.readFileSync('_site/sw.js','utf8').includes('partial-ingredient-evidence-rc171.json')||
             fs.existsSync('_site/data/rc171-japanese-maker-medicinal-and-cpb-partial-checkpoint-20261104.json'))
              throw Error('rc171 source-backed Japanese partial references or medicine separation failed');
          console.log('Verified rc171: 13 source-backed partial references, 134 Japanese names, 11 medicated products, full 600 unchanged');
          // rc172: recompute coverage from every published Japanese name source; no synthetic products.
          const overall172=JSON.parse(fs.readFileSync('_site/overall-evidence-audit-rc172.json','utf8'));
          const brandCoverage172=JSON.parse(fs.readFileSync('_site/brand-coverage.json','utf8'));
          const allQuasi=archived.records.filter(r=>r.kind==='quasi');
          const allCurel=archived.records.filter(r=>r.brand==='キュレル');
          const scope172=overall172.scope;
          const builtIndex=fs.readFileSync('_site/partial-reference-index-rc172.js','utf8');
          if(overall172.release!=='1.0.0-rc.172'||overall172.registeredBrandsTotal!==147||
             overall172.registeredProductNamesTotal!==2163||overall172.priorityBrands!==102||
             overall172.priorityProducts!==2020||scope172.completeJapaneseFormulas!==600||
             scope172.partialJapaneseIngredientEvidence!==1115||
             scope172.withoutVerifiedJapaneseIngredientNames!==305||
             scope172.completeJapaneseFormulas+scope172.partialJapaneseIngredientEvidence+
             scope172.withoutVerifiedJapaneseIngredientNames!==2020||
             overall172.brandRows.length!==102||
             overall172.brandRows.reduce((sum,x)=>sum+x.partial,0)!==1115||
             overall172.sourceAudit.partialReferencesSupersededByFullList!==191||
             overall172.sourceAudit.independentDisclosedWithoutAlreadyTrackedPartial!==5||
             overall172.sourceAudit.distinctPartialSourceProductsAllBrands!==1163||
             brandCoverage172.knownIngredientExcerptCount!==1296||
             catalog.knownIngredientRecords!==1296||allQuasi.length!==87||
             allQuasi.some(r=>!r.activeIngredients||!r.otherIngredients)||
             allCurel.length!==5||allCurel.some(r=>r.activeIngredients!=='アラントイン'||
              r.sourceReview?.activeOtherSeparatedFromManufacturerStarLegend!==true)||
             !builtIndex.includes('rc93-kao-kate-4973167006009')||
             !archivedPublicLinks.includes('overall-evidence-audit-rc172.html')||
             !fs.readFileSync('_site/app.js','utf8').includes('hasSourceBackedPartial')||
             !fs.readFileSync('_site/sw.js','utf8').includes('overall-evidence-audit-rc172.html')||
             fs.existsSync('_site/data/rc172-curel-five-exact-manufacturer-active-group-corrections-20261104.json'))
           throw Error('rc172 actual Japanese source-coverage, medicinal grouping or privacy validation failed');
          console.log('Verified rc172: 600 full, 1115 partial, 305 unconfirmed; 87 medicinal archive records explicitly grouped');
          // rc173 source-evidence layer, strict ID, official host, shade/set and drug guards.
          const overall173=JSON.parse(fs.readFileSync('_site/overall-evidence-audit-rc173.json','utf8'));
          const partial173=JSON.parse(fs.readFileSync('_site/partial-ingredient-evidence-rc173.json','utf8'));
          const progress173=JSON.parse(fs.readFileSync('_site/partial-reference-progress-rc173.json','utf8'));
          const ids173=new Set(partial173.records.map(r=>r.productId));
          const allowed173=new Set(['www.kao-kirei.com','www.bifesta.jp','anuashop.jp','jp.sulwhasoo.com','jp.hera.com']);
          const brand173=JSON.parse(fs.readFileSync('_site/brand-coverage.json','utf8'));
          if(overall173.release!=='1.0.0-rc.173'||
             overall173.registeredBrandsTotal!==147||overall173.priorityBrands!==102||
             overall173.priorityProducts!==2020||overall173.scope.completeJapaneseFormulas!==600||
             overall173.scope.partialJapaneseIngredientEvidence!==1160||
             overall173.scope.withoutVerifiedJapaneseIngredientNames!==260||
             overall173.brandRows.length!==102||
             overall173.brandRows.reduce((sum,b)=>sum+b.partial,0)!==1160||
             overall173.sourceAudit.partialSourceFiles!==33||
             overall173.sourceAudit.sourceDeclaredPartialRecordCount!==1394||
             overall173.sourceAudit.distinctPartialSourceProductsAllBrands!==1208||
             brand173.knownIngredientExcerptCount!==1296||catalog.knownIngredientRecords!==1296||
             progress173.release!=='1.0.0-rc.173'||progress173.newPartialSourceBackedProducts!==45||
             progress173.newJapaneseNameAssociations!==516||progress173.noNameAfter!==260||
             partial173.productCount!==45||partial173.records.length!==45||
             ids173.size!==45||partial173.originalJapaneseNameAssociations!==516||
             partial173.records.reduce((n,r)=>n+r.ingredientCount,0)!==516||
             partial173.records.some(r=>archivedProductIdSet.has(r.productId)||
               partial170Ids.has(r.productId)||partial171Ids.has(r.productId)||
               !allowed173.has(new URL(r.sourceUrl).hostname)||
               r.coverage!=='partial-only'||r.order!=='not-confirmed'||
               r.notFullFormulaArchive!==true||r.labelCompared!==false||
               r.currentFormulaCompared!==false||r.sourceOriginalNamesNotTranslated!==true||
               r.ingredientCount!==r.ingredients.length||
               r.ingredientCount!==r.sourceOriginalJapaneseNames.length||
               !['quasi','cosmetic'].includes(r.kind)||
               !/^[a-f0-9]{64}$/.test(r.sourceEvidenceSha256)||
               !/^[a-f0-9]{64}$/.test(r.sourceSectionSha256))||
             partial173.records.filter(r=>r.kind==='quasi').length!==3||
             partial173.records.filter(r=>r.kind==='quasi').some(r=>r.sourceActiveIngredientNames.length<1||
               r.sourceActiveIngredientNames.length+r.sourceOtherIngredientNames.length!==r.ingredientCount)||
             partial173.records.filter(r=>r.brand==='ヘラ').length!==12||
             partial173.records.filter(r=>r.brand==='ビフェスタ').length!==9||
             !fs.readFileSync('_site/app.js','utf8').includes('/partial-ingredient-evidence-rc173.json')||
             !fs.readFileSync('_site/app.js','utf8').includes('partial-reference-index-rc184.js')||
             !archivedPublicLinks.includes('overall-evidence-audit-rc173.html')||
             !fs.readFileSync('_site/static-api.js','utf8').includes('partial-ingredient-evidence-rc173.json')||
             !fs.readFileSync('_site/sw.js','utf8').includes('partial-reference-progress-rc173.html')||
             fs.existsSync('_site/data/rc173-anua-japan-product-individual-ingredient-checkpoint-20261104.json')||
             fs.existsSync('_site/data/rc173-kao-exact-jan-set-component-partial-checkpoint-20261104.json'))
            throw Error('rc173 checked Japanese ingredient product identity, partial status or publication safeguards failed');
          console.log('Verified rc173: 45 added, 516 Japanese ingredient names, full600 / partial1160 / unconfirmed260');
          // rc174: 54 independent Japanese-manufacturer partial references. No full-list promotion.
          const partial174=JSON.parse(fs.readFileSync('_site/partial-ingredient-evidence-rc174.json','utf8'));
          const progress174=JSON.parse(fs.readFileSync('_site/partial-reference-progress-rc174.json','utf8'));
          const overall174=JSON.parse(fs.readFileSync('_site/overall-evidence-audit-rc174.json','utf8'));
          const ids174=new Set(partial174.records.map(r=>r.productId));
          const allow174=new Set(['www.kracie.co.jp','www.decorte.com','www.cledepeau-beaute.com','torriden.jp','jp.laneige.com']);
          if(partial174.records.length!==54||partial174.productCount!==54||ids174.size!==54||
             partial174.originalJapaneseNameAssociations!==259||
             partial174.records.reduce((n,r)=>n+r.ingredientCount,0)!==259||
             partial174.records.some(r=>archivedProductIdSet.has(r.productId)||
               partial170Ids.has(r.productId)||partial171Ids.has(r.productId)||ids173.has(r.productId)||
               !allow174.has(new URL(r.sourceUrl).hostname)||
               !['quasi','cosmetic'].includes(r.kind)||r.coverage!=='partial-only'||
               r.order!=='not-confirmed'||r.labelCompared!==false||
               r.currentFormulaCompared!==false||r.notFullFormulaArchive!==true||
               r.sourceOriginalNamesNotTranslated!==true||r.sourceOriginalNamesArePartial!==true||
               r.ingredientCount!==r.ingredients.length||
               r.ingredientCount!==r.sourceOriginalJapaneseNames.length||
               !/^[a-f0-9]{64}$/.test(r.sourceEvidenceSha256)||
               !/^[a-f0-9]{64}$/.test(r.sourceSectionSha256))||
             partial174.records.filter(r=>r.kind==='quasi').length!==17||
             partial174.records.filter(r=>r.kind==='cosmetic').length!==37||
             partial174.records.filter(r=>r.brand==='肌美精').length!==17||
             partial174.records.filter(r=>r.brand==='コスメデコルテ').length!==7||
             progress174.release!=='1.0.0-rc.174'||
             progress174.newPartialSourceBackedProducts!==54||
             progress174.newJapaneseNameAssociations!==259||
             progress174.partialOnlyBefore!==1160||progress174.partialOnlyAfter!==1214||
             progress174.noNameBefore!==260||progress174.noNameAfter!==206||
             overall174.release!=='1.0.0-rc.174'||
             overall174.scope.completeJapaneseFormulas!==600||
             overall174.scope.partialJapaneseIngredientEvidence!==1214||
             overall174.scope.withoutVerifiedJapaneseIngredientNames!==206||
             overall174.brandRows.length!==102||
             overall174.brandRows.reduce((n,r)=>n+r.partial,0)!==1214||
             overall174.sourceAudit.distinctPartialSourceProductsAllBrands!==1262||
             overall174.sourceAudit.partialSourceFiles!==34||
             overall174.sourceAudit.sourceDeclaredPartialRecordCount!==1448||
             !fs.readFileSync('_site/app.js','utf8').includes('/partial-ingredient-evidence-rc174.json')||
             !fs.readFileSync('_site/app.js','utf8').includes('partial-reference-index-rc184.js')||
             !archivedPublicLinks.includes('overall-evidence-audit-rc174.html')||
             !fs.readFileSync('_site/static-api.js','utf8').includes('partial-ingredient-evidence-rc174.json')||
             !fs.readFileSync('_site/sw.js','utf8').includes('partial-reference-progress-rc174.html')||
             fs.existsSync('_site/data/rc174-kracie-and-decorte-official-japanese-ingredient-checkpoint-20261104.json')||
             fs.existsSync('_site/data/rc174-torriden-laneige-cledepeau-variants-components-source-checkpoint-20261104.json'))
            throw Error('rc174 Japanese manufacturer partial ingredient sources or label separation failed');
          console.log('Verified rc174: 54 source-backed products, 259 ingredient names, full600 / partial1214 / unconfirmed206');

          // rc177: five independently evidenced BAUM Japanese cosmetic ingredient excerpts; never publish full compositions without rights.
          const partial177=JSON.parse(fs.readFileSync('_site/partial-ingredient-evidence-rc177.json','utf8'));
          const audit177=JSON.parse(fs.readFileSync('_site/overall-evidence-audit-rc177.json','utf8'));
          const queue177=JSON.parse(fs.readFileSync('_site/unverified-ingredient-research-rc177.json','utf8'));
