          console.log('Verified rc177: 5 BAUM official products / 15 partial name facts; full600, partial1219, unknown201');

          // Current rc178 source-backed, short Japanese excerpts only, no manufacturer HTML/archive leak.
          const p178=JSON.parse(fs.readFileSync('_site/partial-ingredient-evidence-rc178.json','utf8'));
          const a178=JSON.parse(fs.readFileSync('_site/overall-evidence-audit-rc178.json','utf8'));
