name: Deploy verified static Formula Bloom site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: formula-bloom-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public static repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble only public static assets and validate catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/_site/' ./ _site/
          test -f _site/index.html
          test -f _site/.nojekyll
          test -f _site/sw.js
          test -f _site/registered-products.js
          test ! -e _site/.github
          test ! -e _site/.git
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync('_site/brand-product-registration.json','utf8'));
          const archived=JSON.parse(fs.readFileSync('_site/formula-records.json','utf8'));
          if(catalog.brandCount!==147||catalog.productNameRecords!==2133||
              catalog.brandsWithRegisteredProductNames!==146||archived.records.length!==309)
            throw Error('Version or Japan formula coverage does not match reviewed rc.112 release');
          const families=fs.readFileSync('_site/official-catalog-families.js','utf8');
          if(!families.includes('rc92-official-family-')||!families.includes('domestic-manufacturer-official-product-family-index'))
            throw Error('The reviewed official family-name index is missing');
          const kaoFamilies=fs.readFileSync('_site/official-kao-family-index.js','utf8');
          if(!kaoFamilies.includes('rc93-kao-')||!kaoFamilies.includes('japan-manufacturer-item-link-referenced-only'))
            throw Error('The official Japanese manufacturer catalog family index is missing');
          const names=fs.readFileSync('_site/official-domestic-catalog-rc94.js','utf8');
          if(!names.includes('rc94-jp-official-')||!names.includes('japanese-official-product-category-name-only'))throw Error('Missing reviewed name catalog');
          const rc100=fs.readFileSync('_site/official-reviewed-rc100.js','utf8');
          if(!rc100.includes('rc100-cpb-')||!rc100.includes('japan-official-category-name-only'))
            throw Error('rc.100 reviewed official product-index module is missing');
          const ui=fs.readFileSync('_site/app.js','utf8');
          if(!ui.includes('withinBrandProductFilter'))throw Error('rc.100 local catalog filter missing');
          const reviewed=fs.readFileSync('_site/official-reviewed-rc101.js','utf8');
          if(!reviewed.includes('rc101-inoui-')||!reviewed.includes('japan-official-series-page-name-only'))
            throw Error('Missing rc101 official Japanese brand/series review');
          const review=fs.readFileSync('_site/official-reviewed-rc102.js','utf8');
          if(!review.includes('rc102-baum-')||!review.includes('japan-official-category-name-only'))
            throw Error('Missing rc102 verified manufacturer catalog module');
          const review103=fs.readFileSync('_site/official-reviewed-rc103.js','utf8');
          if(!review103.includes('rc103-nov-')||!review103.includes('japan-official-category-name-only'))
            throw Error('rc.103 Japan manufacturer product name references missing');
          const rc104=fs.readFileSync('_site/official-reviewed-rc104.js','utf8');
          if(!rc104.includes('rc104-lunamer-')||!rc104.includes('japan-manufacturer-individual-full-ingredients'))
            throw Error('Missing verified rc104 Fujifilm Japanese full-formula identity records');
          const allFuji=archived.records.filter(r=>r.productId==='rc37-lunamer'||r.productId.startsWith('rc104-lunamer-'));
          if(allFuji.length!==5||!['121003000000','121003000001','121004000000','121005000000'].every(id=>
             allFuji.some(r=>r.productId==='rc104-lunamer-'+id&&r.sourceType==='official'&&r.formulaUpdatedAt===null)))
             throw Error('Fujifilm individual products missing or not distinguished from moist toner');
          const review105=fs.readFileSync('_site/official-reviewed-rc105.js','utf8');
          if(!review105.includes('rc105-astalift-100202000001')||!review105.includes('japan-manufacturer-individual-full-ingredients'))
            throw Error('rc105 source-linked Japanese Astalift products missing');
          const ast=archived.records.filter(r=>r.productId.startsWith('rc105-astalift-'));
          if(ast.length!==9||new Set(ast.map(r=>r.productId)).size!==9||
             ast.filter(r=>r.kind==='quasi').length!==3||ast.filter(r=>r.kind==='cosmetic').length!==6||
             ast.some(r=>r.sourceType!=='official'||r.formulaUpdatedAt!==null))
            throw Error('Astalift nine exact Japanese formula snapshots or medicinal partitions mismatch');
          const review106=fs.readFileSync('_site/official-reviewed-rc106.js','utf8');
          if(!review106.includes('rc106-astalift-')||!review106.includes('rc106-lunamer-121105000001-さっぱり'))
            throw Error('Missing rc106 source-linked AstaLift and separate LunaMea emulsion identities');
          const newFormulas=archived.records.filter(r=>r.productId.startsWith('rc106-'));
          if(newFormulas.length!==9||new Set(newFormulas.map(r=>r.productId)).size!==9||
             newFormulas.filter(r=>r.kind==='quasi').length!==3||
             newFormulas.some(r=>r.sourceType!=='official'||r.formulaUpdatedAt!==null))
            throw Error('rc106 nine separately verified Japanese full ingredient snapshots mismatch');
          const rc107=fs.readFileSync('_site/official-reviewed-rc107.js','utf8');
          if(!rc107.includes('rc107-astalift-100609000002')||
             !rc107.includes('rc107-astalift-100712000000')||
             !rc107.includes('japan-manufacturer-individual-full-ingredients'))
            throw Error('Missing rc107 Japanese AstaLift product reference index');
          const added107=archived.records.filter(r=>r.productId.startsWith('rc107-astalift-'));
          if(added107.length!==8||new Set(added107.map(r=>r.productId)).size!==8||
             added107.filter(r=>r.kind==='quasi').length!==2||
             added107.filter(r=>r.kind==='cosmetic').length!==6||
             added107.some(r=>r.sourceType!=='official'||r.formulaUpdatedAt!==null||
               r.region!=='jp'||!r.sourceUrl.includes('h-jp.fujifilm.com/')))
            throw Error('rc107 eight Japanese full-ingredient snapshots incorrectly merged or classified');
          const review108=fs.readFileSync('_site/official-reviewed-rc108.js','utf8');
          if(!review108.includes('rc102-astalift-18d77eb1daf3')||
             !review108.includes('rc108-astalift-100303000002')||
             !review108.includes('japan-manufacturer-individual-full-ingredients'))
            throw Error('rc108 missing manufacturer source-backed in-place upgrades');
          const rc108ids=['rc102-astalift-18d77eb1daf3',
            'rc102-astalift-14dec3220a74',
            'rc102-astalift-f943d166fe0c',
            'rc102-astalift-2cf96daff6f1',
            'rc108-astalift-100303000002'];
          const new108=archived.records.filter(r=>rc108ids.includes(r.productId));
          if(new108.length!==5||new Set(new108.map(r=>r.productId)).size!==5||
             new108.filter(r=>r.kind==='quasi').length!==2||
             new108.filter(r=>r.kind==='cosmetic').length!==3||
             new108.some(r=>r.sourceType!=='official'||r.formulaUpdatedAt!==null||r.region!=='jp'))
            throw Error('rc108 four upgrades and fifth new Japanese full ingredient record not verified');
          const review109=fs.readFileSync('_site/official-reviewed-rc109.js','utf8');
          if(!review109.includes('rc109-astalift-101334000000-morning')||
             !review109.includes('rc109-astalift-101334000000-night')||
             !review109.includes('rc109-astalift-100503000000'))
             throw Error('Missing reviewed Japanese Men and separate medicinal morning/night record references');
          const new109=archived.records.filter(r=>r.productId.startsWith('rc109-'));
          if(new109.length!==7||new Set(new109.map(r=>r.productId)).size!==7||
             new109.filter(r=>r.kind==='quasi').length!==2||
             new109.filter(r=>r.kind==='cosmetic').length!==5||
             new109.some(r=>r.sourceType!=='official'||r.region!=='jp'||r.formulaUpdatedAt!==null))
             throw Error('Expected seven separate Japanese manufacturer formula records');
          const am=new109.find(r=>r.productId==='rc109-astalift-101334000000-morning');
          const pm=new109.find(r=>r.productId==='rc109-astalift-101334000000-night');
          if(!am||!pm||am.ingredientCount!==40||pm.ingredientCount!==33||
             am.ingredients===pm.ingredients||am.volume!=='5g'||pm.volume!=='18g')
             throw Error('Medicinal morning/night types are not differentiated');
          const reviewed110=fs.readFileSync('_site/official-reviewed-rc110.js','utf8');
          const extraIds=['rc94-jp-official-carecera-122',
            'rc94-jp-official-carecera-123',
            'rc94-jp-official-carecera-124',
            'rc94-jp-official-carecera-125',
            'rc61-catalog-024','rc61-catalog-027','rc61-catalog-029','rc61-catalog-033'];
          if(extraIds.some(id=>!reviewed110.includes(id)))
            throw Error('rc110 exact eight manufacturer-matched historical product IDs missing');
          const rohtoEight=archived.records.filter(r=>extraIds.includes(r.productId));
          if(rohtoEight.length!==8||new Set(rohtoEight.map(r=>r.productId)).size!==8||
             rohtoEight.some(r=>r.kind!=='cosmetic'||r.sourceType!=='official'||
               r.region!=='jp'||r.formulaUpdatedAt!==null||
               !r.sourceUrl.startsWith('https://jp.rohto.com/seib/seib?kw=')))
            throw Error('rc110 Rohto eight Japanese ingredient records invalid or duplicative');
          const required=[['rc94-jp-official-carecera-122',34,'4987241195206'],
            ['rc61-catalog-027',12,'4987241155736']];
          if(required.some(([id,n,jan])=>!rohtoEight.some(r=>r.productId===id&&r.ingredientCount===n&&r.sku===jan)))
            throw Error('JAN / exact Japanese ingredient-count mapping failed');
          const new111=fs.readFileSync('_site/official-reviewed-rc111.js','utf8');
          const rc111Ids=['rc94-jp-official-carecera-119',
            'rc94-jp-official-carecera-120','rc94-jp-official-carecera-121',
            'rc94-jp-official-carecera-126',
            'rc61-catalog-031','rc61-catalog-034','rc61-catalog-036','rc61-catalog-038'];
          if(rc111Ids.some(id=>!new111.includes(id))||
             !new111.includes('japan-rohto-maker-item-and-ingredient-display'))
            throw Error('rc111 missing eight exact maker product ID upgrades');
          const items111=archived.records.filter(r=>rc111Ids.includes(r.productId));
          if(items111.length!==8||new Set(items111.map(r=>r.productId)).size!==8||
             items111.some(r=>r.kind!=='cosmetic'||r.sourceType!=='official'||
               r.region!=='jp'||r.formulaUpdatedAt!==null||
               !r.sourceUrl.startsWith('https://jp.rohto.com/seib/seib?kw=')))
            throw Error('rc111 unreviewed Japanese full ingredients or duplicate product');
          const checked111=[['rc94-jp-official-carecera-120',35,'385mL','つめかえ用','4987241167302'],
            ['rc94-jp-official-carecera-121',35,'385mL','つめかえ用','4987241167319'],
            ['rc94-jp-official-carecera-126',32,'450mL',null,'4987241138753'],
            ['rc61-catalog-034',33,'170mL',null,'4987241167012']];
          if(checked111.some(([id,n,volume,variant,jan])=>
             !items111.some(r=>r.productId===id&&r.ingredientCount===n&&
               r.volume===volume&&r.variant===variant&&r.sku===jan)))
            throw Error('rc111 exact Japanese name, pack, fragrance, JAN or source record mismatch');
          const review112=fs.readFileSync('_site/official-reviewed-rc112.js','utf8');
          const coverage112=JSON.parse(fs.readFileSync('_site/brand-coverage.json','utf8'));
          if(!review112.includes('rc112-obagi-x-emulsion-bottle')||
             !review112.includes('rc92-official-family-obagi-003')||
             !review112.includes('japan-rohto-maker-item-and-ingredient-display'))
             throw Error('rc112 reviewed individual Obagi source data or exact product references missing');
          if(catalog.unverifiedFullIngredientCandidateCount!==1824||
             catalog.singleProductCandidateBrandCount!==33||
             coverage112.unresolvedFullIngredientCandidateCount!==1824||
             coverage112.singleProductCandidateBrandCount!==33||
             catalog.allRepublicationPermissionsVerified!==false)
             throw Error('rc112 unverified 1824 remaining candidates/rights are not honestly disclosed');
          const obagi112=archived.records.filter(r=>r.productId.startsWith('rc92-official-family-obagi-')||
             r.productId==='rc112-obagi-x-emulsion-bottle');
          if(obagi112.length!==17||new Set(obagi112.map(r=>r.productId)).size!==17||
             obagi112.some(r=>r.brand!=='オバジ'||r.kind!=='cosmetic'||
               r.sourceType!=='official'||r.region!=='jp'||r.formulaUpdatedAt!==null||
               !r.sourceUrl.startsWith('https://jp.rohto.com/seib/seib?kw=')))
             throw Error('rc112 did not preserve 17 exact Japanese manufacturer formulas');
          const required112=[['rc92-official-family-obagi-003',25,'26mL','4987241199914'],
            ['rc92-official-family-obagi-004',25,'12mL','4987241199938'],
            ['rc112-obagi-x-emulsion-bottle',49,'100g','4987241191789']];
          if(required112.some(([id,n,volume,jan])=>
              !obagi112.some(r=>r.productId===id&&r.ingredientCount===n&&
                r.volume===volume&&r.sku===jan)))
             throw Error('rc112 Obagi regular/large, original bottle, JAN mapping wrong');
          if(fs.existsSync('_site/data/rc112-all-unresolved-japan-formula-triage-20261102.json')||
             fs.existsSync('_site/docs/rc112-rights-and-physical-sku-verification.md'))
             throw Error('Private SKU audit or rights follow-up documents must NOT be published');
          const src=fs.readFileSync('_site/registered-products.js','utf8');
          for(const size of ['50','90'])
            if(!src.includes('rc91-whoo-bicheop-circulation-'+size))
              throw Error('One of the two non-domestic WHOO size candidates is missing');
          console.log('Verified public static release rc.112: 2133 names, 146/147 brand names, 309 Japanese full-ingredient snapshots');
          NODE
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
